# Runs the Robot Framework suite in headless Chrome, selected by tag.
#   Manual / agent: Actions > Robot tests > Run workflow, include = a tag pattern (smoke, regression, REQ-300,
#                   INCIDENT-1, smokeORREQ-300, ...). run_key lets the ADK agent find its own run.
#   Pull requests:  Kiro automate starts this workflow on the PR branch (include = smokeOR<INCIDENT>). There is no
#                   pull_request trigger: a PR opened by the workflow token leaves a blocked run that shows as a
#                   failing build in Jira.
name: Robot tests
run-name: ${{ inputs.run_key || format('Robot tests ({0})', inputs.include || 'regression') }}

on:
  workflow_dispatch:
    inputs:
      include:
        description: "Robot tag pattern to run, e.g. smoke, regression, REQ-300, smokeORREQ-300"
        required: true
        default: smoke
      run_key:
        description: "Optional run name, set by the ADK agent to find this run"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INCLUDE: ${{ inputs.include || 'regression' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Robot Framework
        run: pip install -r requirements.txt
      - name: Run tests tagged "${{ env.INCLUDE }}"
        run: robot --outputdir results --include "$INCLUDE" tests
      - name: Summary
        if: always()
        run: python ci/summary.py results/output.xml "$INCLUDE"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results/
